# ============================================================
# web2api docker-compose —— Gemini 双引擎号池管理网关
# 使用：docker compose up -d
# 首次启动后访问 http://<服务器IP>:8800/admin 配置管理员
# ============================================================

services:
  web2api:
    build:
      context: .
      dockerfile: Dockerfile
    # 也可直接用预构建镜像（取消注释改 image）
    # image: web2api:latest
    container_name: web2api
    restart: unless-stopped

    ports:
      - "${WEB2API_PORT:-8800}:8800"

    environment:
      # 环境变量覆盖 config.yaml（见 .env.example）
      - WEB2API_LISTEN=0.0.0.0:8800
      - WEB2API_API_KEYS=${WEB2API_API_KEYS:-sk-web2api}
      - WEB2API_DB_PATH=/app/data/web2api.db
      - WEB2API_DEFAULT_ENGINE=${WEB2API_DEFAULT_ENGINE:-auto}
      - WEB2API_PROXY=${WEB2API_PROXY:-}
      # 时区
      - TZ=Asia/Shanghai

    volumes:
      # 配置文件：优先用宿主机 ./config.yaml；不存在时用 docker/config.yaml 模板
      # 首次部署：cp docker/config.yaml ./config.yaml 后按需修改
      - ./config.yaml:/app/data/config.yaml:ro
      # 持久化数据：SQLite 库
      - web2api-data:/app/data
      # 引擎B 账号凭据目录（AIStudio2API 兼容的 auth/ 目录）
      - web2api-auth:/app/auth
      # 引擎A Cookie 自动轮换缓存
      - web2api-cookies:/app/cookies

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8800/v1/models"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  web2api-data:
  web2api-auth:
  web2api-cookies:
