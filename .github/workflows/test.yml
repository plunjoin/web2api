name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # 契约测试矩阵所在包：gateway（Responses/Chat 入站规范化）、
        # provider（能力表与引擎适配）、ir、engine/upstream（OpenAI 兼容出站）、
        # upstream/antigravity（Gemini 报文）。其余包无测试文件，./... 一并跑。
        run: go test ./...
