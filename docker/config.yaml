# ============================================================
# web2api 高级配置模板 —— 基础 Docker 编排无需导入此文件
# 路径均为容器内绝对路径（/app/...），由 docker-compose volumes 持久化
# 也可不挂载配置文件，仅用环境变量覆盖（见 .env.example）
# ============================================================

server:
  listen: "0.0.0.0:8800"
  api_keys:
    - "sk-web2api"
  db_path: "/app/data/web2api.db"
  log_level: "info"

routing:
  default_engine: "auto"

# 引擎A：Gemini 网页号在管理台添加（号池管理 → + 添加 Gemini 号）
engine_a:
  enabled: true
  proxy: ""                         # 容器内访问宿主机代理：http://host.docker.internal:7890
  refresh_seconds: 600
  timeout_seconds: 300

# 引擎B：AI Studio 原生逆向（内置 WAA 纯 Go 后端，零外部依赖）
engine_b:
  enabled: true
  mode: "native"
  auth_states: "/app/auth"
  routing_strategy: "round-robin"
  upstream_channels: "playground,build"
  per_account_concurrency: 2
  refresh_seconds: 300

# 官方 Gemini 后端：独立于网页账号池，完整支持官方参数和事件
gemini_api:
  enabled: false
  base_url: "https://generativelanguage.googleapis.com"
  api_key: ""                      # 推荐通过 WEB2API_GEMINI_API_KEY 注入
  access_token: ""                 # GCS files:register 等需要 OAuth 的功能
  proxy: ""
  timeout_seconds: 0               # 0 不限制总时长，允许长后台 SSE
